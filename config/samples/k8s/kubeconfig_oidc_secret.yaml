# Sample Secret containing a Kubeconfig configured with an OIDC auth-provider
apiVersion: v1
kind: Secret
metadata:
  name: host-kubeconfig-oidc
  namespace: guest
type: Opaque
stringData:
  kubeconfig: |
    apiVersion: v1
    kind: Config
    clusters:
    - cluster:
        server: https://partnerop-control-plane:6443
        insecure-skip-tls-verify: true
      name: host-cluster
    contexts:
    - context:
        cluster: host-cluster
        user: oidc-operator
      name: host-context
    current-context: host-context
    users:
    - name: oidc-operator
      user:
        auth-provider:
          name: oidc
          config:
            idp-issuer-url: https://keycloak-host-idp:8443/realms/host-operator
            client-id: guest-operator
            client-secret-name: host-idp-credentials
            client-secret-key: client_secret
